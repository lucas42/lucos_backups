version: 2.1
orbs:
  lucos: lucos/deploy@0
jobs:
  test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Reject pre-release base images
          command: |
            if grep -nE '^FROM [^ ]*:[^ ]*(alpha|beta|[0-9](a|b|rc)[-._]?[0-9]|[-._]rc[-._]?[0-9])' Dockerfile; then
              echo "Pre-release base image tag(s) found above."
              echo "Pre-release interpreters build fine and break at runtime when a"
              echo "dependency publishes a wheel built against a later pre-release."
              exit 1
            fi
      - setup_remote_docker
      - run:
          name: Build the image under test
          command: docker build --target test -t lucos_backups:test .
      - run:
          name: Run tests inside the shipped image
          command: docker run --rm lucos_backups:test
workflows:
  version: 2
  build-deploy:
    jobs:
      - test
      - lucos/build:
          serial-group: << pipeline.project.slug >>/build/<< pipeline.git.branch >>
      - lucos/deploy-avalon:
          serial-group: deploy-avalon
          requires:
            - test
            - lucos/build
          filters:
            branches:
              only:
                - main
